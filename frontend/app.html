<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <title>Carsharing</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="hlavicka">
        <div>
            Přihlášen: <strong id="jmenoUzivatele"></strong>
            <span id="znackaRole" class="znacka-role"></span>
        </div>
        <button class="sekundarni" id="tlacitkoOdhlasit">Odhlásit se</button>
    </div>

    <div id="chyba" class="chyba skryto"></div>
    <p id="zprava" class="karta skryto"></p>

    <div class="karta" id="kartaVozidla">
        <h2>Dostupná vozidla</h2>
        <div id="seznamVozidel"></div>
    </div>

    <div class="karta skryto" id="kartaRezervace">
        <h2>Aktivní rezervace</h2>
        <p id="popisRezervace"></p>
        <button id="tlacitkoZahajitJizdu">Zahájit jízdu</button>
        <button class="sekundarni" id="tlacitkoZrusitRezervaci">Zrušit rezervaci</button>
    </div>

    <div class="karta skryto" id="kartaJizda">
        <h2>Probíhá jízda</h2>
        <p id="popisJizdy"></p>
        <label for="ujetoKm">Ujeté kilometry</label>
        <input type="number" id="ujetoKm" min="0" step="0.1" value="0">
        <button id="tlacitkoUkoncitJizdu">Ukončit jízdu</button>
    </div>

    <div class="karta">
        <h2>Historie jízd</h2>
        <table id="tabulkaHistorie">
            <thead>
                <tr>
                    <th>Jízda</th>
                    <th>Vozidlo</th>
                    <th>Ujeto (km)</th>
                    <th>Zahájena</th>
                    <th>Ukončena</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <p id="historiePrazdna" class="poznamka skryto">Zatím žádné jízdy.</p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/state.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
