server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Zabranime cachovani v prohlizeci - je to maly demo projekt, kde je
    # staleness (stary JS/HTML mismatch) horsi problem nez rezie z opakovaneho
    # stahovani souboru.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
